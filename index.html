    /* ==========================================================================
       COMPONENTE EMAIL + OTP + CAPTCHA
       ========================================================================== */
    function EmailOtpGroup({ field, value, onChange, error, onDuplicateResult }) {
      const [localEmail, setLocalEmail] = useState(value || '');
      const [step, setStep] = useState(value ? 'verified' : 'input');
      const [loading, setLoading] = useState(false);
      const [captchaText, setCaptchaText] = useState('');
      const [userCaptcha, setUserCaptcha] = useState('');
      const [otpInput, setOtpInput] = useState('');
      const canvasRef = useRef(null);

      const maxLen = field.maxLength ? parseInt(field.maxLength, 10) : undefined;
      const isUpper = field.forceUppercase && field.forceUppercase.toLowerCase() === 'yes';

      useEffect(() => {
        if (value) {
          setLocalEmail(value);
          setStep('verified');
        }
      }, [value]);

      useEffect(() => {
        if (step === 'captcha') generarCaptcha();
      }, [step]);

      const handleEmailChange = (val) => {
        let cleanVal = isUpper ? val.toUpperCase() : val;
        setLocalEmail(cleanVal);
        onDuplicateResult(field.name, false);
        if (value) onChange('');
      };

      const iniciarVerificacion = async () => {
        const emailTrimmed = localEmail.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailTrimmed)) {
          Swal.fire({ icon: 'warning', title: 'Correo inválido', text: 'Ingresa un correo electrónico válido.', confirmButtonColor: '#439859' });
          return;
        }

        setLoading(true);
        try {
          const resDup = await serverCall('checkDuplicate', emailTrimmed, field.name);
          const isDup = resDup.success && resDup.data?.exists;
          onDuplicateResult(field.name, isDup);
          if (isDup) {
            setLoading(false);
            Swal.fire({ icon: 'error', title: 'Correo Registrado', text: 'Este correo ya existe en la base de datos.', confirmButtonColor: '#439859' });
            return;
          }
        } catch (e) {
          setLoading(false);
          Swal.fire('Error', 'Falla de conexión al verificar correo.', 'error');
          return;
        }

        try {
          const res = await serverCall('verificarLimiteDiarioOTP');
          setLoading(false);
          if (res.usarCaptcha) setStep('captcha');
          else ejecutarEnvioOTP(emailTrimmed);
        } catch (e) {
          setLoading(false);
          setStep('captcha');
        }
      };

      const generarCaptcha = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
        let text = '';
        for (let i = 0; i < 6; i++) text += chars.charAt(Math.floor(Math.random() * chars.length));
        setCaptchaText(text);
        setUserCaptcha('');

        for (let i = 0; i < 35; i++) {
          ctx.fillStyle = `rgba(${Math.random()*200},${Math.random()*200},${Math.random()*200},0.28)`;
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.font = 'bold 30px Inter, sans-serif';
        ctx.fillStyle = '#0a3d62';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < text.length; i++) {
          ctx.save();
          ctx.translate(32 * i + 30, canvas.height / 2);
          ctx.rotate((Math.random() - 0.5) * 0.45);
          ctx.fillText(text[i], 0, 0);
          ctx.restore();
        }
      };

      const verificarCaptcha = () => {
        if (userCaptcha.trim().toUpperCase() !== captchaText.toUpperCase()) {
          Swal.fire({ icon: 'error', title: 'Código incorrecto', text: 'El texto no coincide con la imagen.', confirmButtonColor: '#ff3b30' });
          generarCaptcha();
          return;
        }
        setStep('verified');
        onChange(localEmail.trim());
      };

      const ejecutarEnvioOTP = async (emailToUse) => {
        setLoading(true);
        try {
          const res = await serverCall('enviarCodigoOTP', emailToUse || localEmail.trim());
          setLoading(false);
          if (res.status === 'success') {
            setStep('otp');
            setOtpInput('');
          } else if (res.usarCaptcha) {
            setStep('captcha');
          } else {
            Swal.fire('Error', res.message, 'error');
            setStep('input');
          }
        } catch (e) {
          setLoading(false);
          Swal.fire('Error', 'Falla al enviar código.', 'error');
        }
      };

      const confirmarOTP = async () => {
        if (otpInput.length !== 6) return;
        setLoading(true);
        try {
          const res = await serverCall('verificarCodigoOTP', localEmail.trim(), otpInput);
          setLoading(false);
          if (res.status === 'success') {
            setStep('verified');
            onChange(localEmail.trim());
          } else {
            Swal.fire('Incorrecto', res.message, 'error');
          }
        } catch (e) {
          setLoading(false);
          Swal.fire('Error', 'Falla al verificar código.', 'error');
        }
      };

      const reiniciarTodo = () => {
        setStep('input');
        onChange('');
        setOtpInput('');
        setUserCaptcha('');
      };

      return (
        <div className="form-group fade-in">
          <label>
            {field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}
            <HelperTooltip text={field.helperText} />
          </label>
          <ExampleImageRender url={field.exampleImage} hidden={false} />

          {step === 'input' && (
            <div className="cp-row">
              <div className="form-group" style={{marginBottom: 0}}>
                <input type="email" className={error ? 'input-error' : ''} placeholder={field.placeholder || "ejemplo@correo.com"} maxLength={maxLen} value={localEmail} onChange={e => handleEmailChange(e.target.value)} />
                {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
              </div>
              <div className="btn-container">
                <button type="button" className="btn btn-primary" onClick={iniciarVerificacion} disabled={loading || !localEmail.trim()}>
                  {loading ? <i className="fas fa-spinner fa-spin"></i> : 'Verificar'}
                </button>
              </div>
            </div>
          )}

          {step === 'captcha' && (
            <div className="otp-stage fade-in">
              <p style={{fontWeight: 600, marginBottom: '10px'}}>Escribe los caracteres de la imagen</p>
              <div className="captcha-container">
                <canvas ref={canvasRef} className="captcha-canvas" width="220" height="70"></canvas>
                <button type="button" className="btn-reload-captcha" onClick={generarCaptcha}><i className="fas fa-sync-alt"></i></button>
              </div>
              <input type="text" className="form-control" placeholder="Código de seguridad" value={userCaptcha} onChange={e => setUserCaptcha(e.target.value)} style={{maxWidth: '240px', margin: '0 auto 14px', textAlign: 'center', fontWeight: 700}} />
              <div style={{display: 'flex', gap: '10px', justifyContent: 'center'}}>
                <button type="button" className="btn btn-ghost" onClick={reiniciarTodo}>Cancelar</button>
                <button type="button" className="btn btn-primary" style={{maxWidth: '160px'}} onClick={verificarCaptcha} disabled={!userCaptcha.trim()}>Confirmar</button>
              </div>
            </div>
          )}

          {step === 'otp' && (
            <div className="otp-stage fade-in">
              <p style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Código de 6 dígitos enviado a:</p>
              <strong style={{display: 'block', marginBottom: '14px'}}>{localEmail}</strong>
              <input type="text" className="form-control" inputMode="numeric" placeholder="000000" maxLength="6" value={otpInput} onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))} style={{letterSpacing: '8px', textAlign: 'center', fontSize: '1.5rem', fontWeight: 700, maxWidth: '220px', margin: '0 auto 14px'}} />
              <button type="button" className="btn btn-primary" onClick={confirmarOTP} disabled={loading || otpInput.length !== 6} style={{maxWidth: '220px', margin: '0 auto 10px'}}>
                {loading ? <i className="fas fa-spinner fa-spin"></i> : 'Confirmar código'}
              </button>
              <div>
                <button type="button" className="btn btn-ghost" onClick={reiniciarTodo}>Cambiar correo o reenviar</button>
              </div>
            </div>
          )}

          {step === 'verified' && (
            <div className="cp-row fade-in">
              <div className="form-group" style={{marginBottom: 0, position: 'relative'}}>
                <input type="email" className="input-success" value={localEmail} disabled readOnly style={{paddingRight: '40px'}} />
                <i className="fas fa-check-circle" style={{position: 'absolute', right: '14px', top: '50%', transform: 'translateY(-50%)', color: 'var(--verde-jara)', fontSize: '1.2rem'}}></i>
              </div>
              <div className="btn-container">
                <button type="button" className="btn btn-secondary" onClick={reiniciarTodo}>Cambiar</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ==========================================================================
       COMPONENTE CURP Y DATOS PERSONALES
       ========================================================================== */
    function CurpGroup({ field, formData, updateMultipleFields, errorFields }) {
      const [loading, setLoading] = useState(false);
      const n = formData.nombres || '';
      const p = formData.apellido_paterno || '';
      const m = formData.apellido_materno || '';
      const curpVal = formData.curp || '';

      const handleUpper = (key, val) => {
        const clean = val.toUpperCase().replace(/\s{2,}/g, ' ');
        updateMultipleFields({ [key]: clean });
      };

      const procesarCURP = async () => {
        if (curpVal.length !== 18) {
          Swal.fire({ title: 'Atención', text: 'La CURP debe tener 18 caracteres.', icon: 'warning', confirmButtonColor: '#439859' });
          return;
        }

        const rfc = curpVal.substring(0, 10);
        const anio = curpVal.substring(4, 6);
        const mes = curpVal.substring(6, 8);
        const dia = curpVal.substring(8, 10);
        const siglo = parseInt(anio, 10) > 26 ? "19" : "20";
        const fecha_nacimiento = `${dia}/${mes}/${siglo}${anio}`;
        const sexoCurp = curpVal.charAt(10);
        const sexo = sexoCurp === 'M' ? 'MUJER' : 'HOMBRE';
        const nombre_completo = `${n} ${p} ${m}`.replace(/\s+/g, ' ').trim();

        const nomProcesado = procesarNombreCurp(quitarAcentos(limpiarPreposiciones(n.toUpperCase())));
        const patLimpio = quitarAcentos(limpiarPreposiciones(p.toUpperCase()));
        const matLimpio = quitarAcentos(limpiarPreposiciones(m.toUpperCase()));

        const l1 = patLimpio.charAt(0) || 'X';
        let vP = patLimpio.substring(1).search(/[AEIOU]/);
        const l2 = vP !== -1 ? patLimpio.charAt(vP + 1) : 'X';
        const l3 = matLimpio ? matLimpio.charAt(0) : 'X';
        const l4 = nomProcesado.charAt(0) || 'X';

        const c1 = obtenerConsonanteInterna(patLimpio);
        const c2 = matLimpio ? obtenerConsonanteInterna(matLimpio) : 'X';
        const c3 = obtenerConsonanteInterna(nomProcesado);

        let iniciales = l1 + l2 + l3 + l4;
        const altisonantes = ["BACA","BAKA","BUEI","BUEY","CACA","CACO","CAGA","CAGO","CAKA","CAKO","COGE","COGI","COJA","COJE","COJI","COJO","COLA","CULO","FALO","FETO","GETA","GUEI","GUEY","JETA","JOTO","KACA","KACO","KAGA","KAGO","KAKA","KAKO","KOGE","KOGI","KOJA","KOJE","KOJI","KOJO","KOLA","KULO","LILO","LOCA","LOCO","LOKA","LOKO","MAME","MAMO","MEAR","MEAS","MEON","MIAR","MION","MOCO","MOKO","MUTE","MULA","PEDA","PEDO","PENE","PIPI","PITO","POPO","PUTA","PUTO","QULO","RATA","ROBA","ROBE","ROBO","RUIN","SENO","TETA","VACA","VAGA","VAGO","VAKA","VUEI","VUEY","WUEI","WUEY"];
        if (altisonantes.includes(iniciales)) iniciales = l1 + 'X' + l3 + l4;

        const complementos = sexoCurp + curpVal.substring(11, 13) + c1 + c2 + c3;

        if (curpVal.substring(0, 4) !== iniciales || curpVal.substring(4, 10) !== (anio + mes + dia) || curpVal.substring(10, 16) !== complementos) {
          Swal.fire({ title: 'Atención', text: 'La CURP no coincide matemáticamente con tus nombres y fecha de nacimiento.', icon: 'warning', confirmButtonColor: '#439859' });
          return;
        }

        setLoading(true);
        try {
          const res = await serverCall('validarExistencia', curpVal, nombre_completo);
          if (res.existe) {
            Swal.fire({ title: 'Cliente Existente', html: `El <b>${res.motivo}</b> ingresado ya está registrado.<br>Número de cliente: <b>${res.numCliente}</b>`, icon: 'warning', confirmButtonColor: '#439859' });
            updateMultipleFields({ curp: '', rfc: '' });
          } else {
            updateMultipleFields({ rfc, fecha_nacimiento, sexo, nombre_completo });
            Swal.fire({ title: '¡CURP Válida!', text: 'Identidad verificada.', icon: 'success', timer: 1400, showConfirmButton: false });
          }
        } catch (e) {
          Swal.fire('Error', 'No se pudo validar la CURP con el servidor.', 'error');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{width: '100%'}}>
          <div className="form-group">
            <label>Nombre(s) *</label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <input type="text" className={errorFields.nombres ? 'input-error' : (n ? 'input-success' : '')} value={n} onChange={e => handleUpper('nombres', e.target.value)} placeholder="Ej. JUAN CARLOS" />
            {errorFields.nombres && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.nombres}</div>}
          </div>
          <div className="row-2">
            <div className="form-group">
              <label>Apellido paterno *</label>
              <input type="text" className={errorFields.apellido_paterno ? 'input-error' : (p ? 'input-success' : '')} disabled={!n} value={p} onChange={e => handleUpper('apellido_paterno', e.target.value)} placeholder="Ej. PEREZ" />
              {errorFields.apellido_paterno && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.apellido_paterno}</div>}
            </div>
            <div className="form-group">
              <label>Apellido materno *</label>
              <input type="text" className={errorFields.apellido_materno ? 'input-error' : (m ? 'input-success' : '')} disabled={!p} value={m} onChange={e => handleUpper('apellido_materno', e.target.value)} placeholder="Ej. LOPEZ" />
              {errorFields.apellido_materno && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.apellido_materno}</div>}
            </div>
          </div>
          <div className="cp-row">
            <div className="form-group">
              <label>CURP * <HelperTooltip text={field.helperText} /></label>
              <input type="text" className={errorFields.curp ? 'input-error' : (formData.rfc ? 'input-success' : '')} disabled={!m} value={curpVal} onChange={e => updateMultipleFields({ curp: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''), rfc: '' })} maxLength={18} placeholder="18 caracteres" />
              {errorFields.curp && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.curp}</div>}
            </div>
            <div className="btn-container">
              <button type="button" className="btn btn-primary" onClick={procesarCURP} disabled={loading || curpVal.length !== 18}>
                {loading ? <i className="fas fa-spinner fa-spin"></i> : 'Validar'}
              </button>
            </div>
          </div>
          <div className="form-group">
            <label>Nombre Completo</label>
            <input type="text" value={formData.nombre_completo || ''} readOnly />
          </div>
          <div className="row-2">
            <div className="form-group">
              <label>RFC</label>
              <input type="text" value={formData.rfc || ''} readOnly />
            </div>
            <div className="form-group">
              <label>Fecha de Nacimiento</label>
              <input type="text" value={formData.fecha_nacimiento || ''} placeholder="DD/MM/AAAA" readOnly />
            </div>
          </div>
          <div className="form-group">
            <label>Sexo</label>
            <input type="text" value={formData.sexo || ''} readOnly />
          </div>
        </div>
      );
    }

    /* ==========================================================================
       COMPONENTE CÓDIGO POSTAL Y DIRECCIÓN
       ========================================================================== */
    function CpGroup({ field, formData, updateMultipleFields, errorFields, dynamicOptions, setDynamicOptions }) {
      const [loading, setLoading] = useState(false);
      const cp = formData.cp || '';
      const valid = !!formData.estado && !!formData.ciudad;

      const handleNum = (key, val) => updateMultipleFields({ [key]: val.replace(/[^0-9]/g, ''), estado: '', ciudad: '', colonia: '' });
      const handleUpper = (key, val) => updateMultipleFields({ [key]: val.toUpperCase() });

      const validarCP = async () => {
        if (cp.length !== 5) return;
        setLoading(true);
        try {
          const res = await serverCall('consultarCodigoPostal', cp);
          if (res.error) {
            Swal.fire({ title: 'No encontrado', text: res.mensaje, icon: 'warning', confirmButtonColor: '#439859' });
            updateMultipleFields({ estado: '', ciudad: '', colonia: '' });
          } else {
            updateMultipleFields({ estado: res.estado.toUpperCase(), ciudad: res.municipio.toUpperCase(), colonia: '' });
            setDynamicOptions(prev => ({ ...prev, colonia: res.colonias || [] }));
          }
        } catch (e) {
          Swal.fire('Error', 'No se pudo consultar el Código Postal.', 'error');
        } finally {
          setLoading(false);
        }
      };

      const colonias = dynamicOptions.colonia || (formData.colonia ? [formData.colonia] : []);

      return (
        <div style={{width: '100%'}}>
          <div className="cp-row">
            <div className="form-group">
              <label>Código Postal * <HelperTooltip text={field.helperText} /></label>
              <ExampleImageRender url={field.exampleImage} hidden={false} />
              <input type="text" inputMode="numeric" className={errorFields.cp ? 'input-error' : (valid ? 'input-success' : '')} value={cp} onChange={e => handleNum('cp', e.target.value)} maxLength={5} placeholder="Ej. 80000" />
              {errorFields.cp && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.cp}</div>}
            </div>
            <div className="btn-container">
              <button type="button" className="btn btn-primary" onClick={validarCP} disabled={loading || cp.length !== 5}>
                {loading ? <i className="fas fa-spinner fa-spin"></i> : 'Validar'}
              </button>
            </div>
          </div>
          <div className="row-2">
            <div className="form-group">
              <label>Estado</label>
              <input type="text" value={formData.estado || ''} readOnly disabled />
            </div>
            <div className="form-group">
              <label>Ciudad o Municipio</label>
              <input type="text" value={formData.ciudad || ''} readOnly disabled />
            </div>
          </div>
          <div className="form-group">
            <label>Colonia *</label>
            <select className={errorFields.colonia ? 'input-error' : ''} disabled={!valid} value={formData.colonia || ''} onChange={e => updateMultipleFields({ colonia: e.target.value })}>
              <option value="">{valid ? 'Selecciona tu colonia...' : 'Valida primero tu C.P...'}</option>
              {colonias.map((c, i) => <option key={i} value={c.toUpperCase()}>{c.toUpperCase()}</option>)}
            </select>
            {errorFields.colonia && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.colonia}</div>}
          </div>
          <div className="form-group">
            <label>Calle *</label>
            <input type="text" className={errorFields.calle ? 'input-error' : ''} disabled={!valid} value={formData.calle || ''} onChange={e => handleUpper('calle', e.target.value)} />
            {errorFields.calle && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.calle}</div>}
          </div>
          <div className="row-2">
            <div className="form-group">
              <label>Número Exterior *</label>
              <input type="text" className={errorFields.num_ext ? 'input-error' : ''} disabled={!formData.calle} value={formData.num_ext || ''} onChange={e => handleUpper('num_ext', e.target.value)} />
              {errorFields.num_ext && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.num_ext}</div>}
            </div>
            <div className="form-group">
              <label>Número Interior</label>
              <input type="text" disabled={!formData.num_ext} value={formData.num_int || ''} onChange={e => handleUpper('num_int', e.target.value)} placeholder="Opcional" />
            </div>
          </div>
          <div className="form-group">
            <label>Entre calles *</label>
            <input type="text" className={errorFields.entre_calles ? 'input-error' : ''} disabled={!formData.num_ext} value={formData.entre_calles || ''} onChange={e => handleUpper('entre_calles', e.target.value)} />
            {errorFields.entre_calles && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.entre_calles}</div>}
          </div>
          <div className="form-group">
            <label>Referencia de domicilio *</label>
            <input type="text" className={errorFields.referencia ? 'input-error' : ''} disabled={!formData.entre_calles} value={formData.referencia || ''} onChange={e => handleUpper('referencia', e.target.value)} />
            {errorFields.referencia && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{errorFields.referencia}</div>}
          </div>
        </div>
      );
    }

    /* ==========================================================================
       FIRMA DIGITAL EN PAD TÁCTIL (signature)
       ========================================================================== */
    function SignaturePadField({ field, value, onSignatureSaved, onClearSignature, error }) {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        if (canvas.width !== rect.width && rect.width > 0) {
          canvas.width = rect.width;
          canvas.height = 190;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          if (value && value.preview) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = value.preview;
          }
        }
      }, []);

      const getCoords = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };

      const start = (e) => {
        setIsDrawing(true);
        const c = getCoords(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const c = getCoords(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(c.x, c.y);
        ctx.strokeStyle = '#1d1d1f';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
      };

      const stop = () => {
        if (!isDrawing) return;
        setIsDrawing(false);
        const dataUrl = canvasRef.current.toDataURL('image/jpeg', 0.85);
        onSignatureSaved(field, dataUrl);
      };

      const clear = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        onClearSignature(field.name);
      };

      return (
        <div className="form-group fade-in">
          <label>
            {field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}
            <HelperTooltip text={field.helperText} />
          </label>
          <ExampleImageRender url={field.exampleImage} hidden={!!value} />
          <div style={{position: 'relative', width: '100%'}}>
            <canvas
              ref={canvasRef}
              className={`signature-pad ${error ? 'input-error' : (value ? 'input-success' : '')}`}
              onMouseDown={start} onMouseMove={draw} onMouseUp={stop} onMouseLeave={stop}
              onTouchStart={start} onTouchMove={draw} onTouchEnd={stop}
            />
            <button type="button" onClick={clear} className="btn btn-secondary" style={{position: 'absolute', top: 10, right: 10, padding: '6px 12px', minHeight: 'auto', fontSize: '0.82rem'}}>
              <i className="fas fa-eraser"></i> Limpiar
            </button>
          </div>
          {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
        </div>
      );
    }

    /* ==========================================================================
       RENDERIZADOR UNIVERSAL DE CAMPOS (FieldRenderer)
       ========================================================================== */
    function FieldRenderer({
      field, value, onChange, formData, updateMultipleFields,
      dynamicOptions, setDynamicOptions, errorFields, onDuplicateResult,
      onOpenScanner, onDeviceFileSelected, onSignatureSaved, onClearMedia
    }) {
      const error = errorFields[field.name];
      const inputCls = `${error ? 'input-error' : (value ? 'input-success' : '')}`;

      if (field.type === 'curp') return <CurpGroup field={field} formData={formData} updateMultipleFields={updateMultipleFields} errorFields={errorFields} />;
      if (field.type === 'cp') return <CpGroup field={field} formData={formData} updateMultipleFields={updateMultipleFields} errorFields={errorFields} dynamicOptions={dynamicOptions} setDynamicOptions={setDynamicOptions} />;
      if (field.type === 'email') return <EmailOtpGroup field={field} value={value} onChange={onChange} error={error} onDuplicateResult={onDuplicateResult} />;
      if (field.type === 'signature') return <SignaturePadField field={field} value={value} onSignatureSaved={onSignatureSaved} onClearSignature={onClearMedia} error={error} />;

      // Nuevos field_type de Cámara Inteligente en Vivo
      if (CAMERA_LIVE_TYPES.includes(field.type)) {
        return <LiveCameraSlotField field={field} value={value} onOpenScanner={onOpenScanner} error={error} />;
      }

      // Nuevo field_type archivo_documento y archivos generales
      if (FILE_UPLOAD_TYPES.includes(field.type)) {
        return <DeviceFileUploadField field={field} value={value} onFileSelected={onDeviceFileSelected} onClearFile={onClearMedia} error={error} />;
      }

      if (field.type === 'gps') {
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            {value ? (
              <div style={{display: 'inline-flex', alignItems: 'center', gap: '10px', padding: '12px 16px', background: 'var(--verde-jara-light)', color: '#1b4d29', borderRadius: '14px', fontWeight: 600}}>
                <i className="fas fa-location-dot"></i><span>{value}</span>
                <button type="button" className="btn-ghost" onClick={() => onChange('')}><i className="fas fa-times"></i></button>
              </div>
            ) : (
              <button type="button" className="btn btn-secondary" style={{width: '100%'}} onClick={() => {
                if (navigator.geolocation) {
                  navigator.geolocation.getCurrentPosition(
                    pos => onChange(`${pos.coords.latitude}, ${pos.coords.longitude}`),
                    () => Swal.fire('Atención', 'Debes permitir el acceso a tu ubicación.', 'warning')
                  );
                }
              }}>
                <i className="fas fa-location-crosshairs"></i> Capturar mi ubicación actual
              </button>
            )}
            {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
          </div>
        );
      }

      if (field.type === 'toggle') {
        const isChecked = value === 'Sí';
        return (
          <div className="form-group" style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 4px', borderBottom: '1px solid #e5e5ea'}}>
            <div style={{flex: 1, paddingRight: '12px'}}>
              <label style={{marginBottom: 0}}>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
              <ExampleImageRender url={field.exampleImage} hidden={false} />
            </div>
            <label className="toggle-switch">
              <input type="checkbox" checked={isChecked} onChange={e => onChange(e.target.checked ? 'Sí' : 'No')} />
              <span className="toggle-slider"></span>
            </label>
          </div>
        );
      }

      if (field.type === 'multi_select') {
        const checked = Array.isArray(value) ? value : (value ? String(value).split(',').map(v=>v.trim()).filter(Boolean) : []);
        const toggle = opt => onChange(checked.includes(opt) ? checked.filter(v => v !== opt) : [...checked, opt]);
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <div className="chips-group">
              {(field.options||[]).map((opt, i) => (
                <div key={i} className={`chip ${checked.includes(opt) ? 'selected' : ''}`} onClick={() => toggle(opt)}>{opt}</div>
              ))}
            </div>
            {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
          </div>
        );
      }

      if (['slider', 'range'].includes(field.type)) {
        const min = field.options?.[0] ? parseInt(field.options[0], 10) : 0;
        const max = field.options?.[1] ? parseInt(field.options[1], 10) : 100;
        const step = field.options?.[2] ? parseInt(field.options[2], 10) : 1;
        const val = value || min;
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <input type="range" className="range-slider" min={min} max={max} step={step} value={val} onChange={e => onChange(e.target.value)} />
            <div className="range-value">{field.placeholder ? field.placeholder.replace('{val}', val) : val}</div>
          </div>
        );
      }

      if (field.type === 'select') {
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <select className={inputCls} value={value || ''} onChange={e => onChange(e.target.value)}>
              <option value="">{field.placeholder || 'Selecciona...'}</option>
              {(field.options||[]).map((o, i) => <option key={i} value={o}>{o}</option>)}
            </select>
            {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
          </div>
        );
      }

      if (field.type === 'radio') {
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <div className="radio-group">
              {(field.options||[]).map((opt, i) => (
                <div key={i} className={`radio-item ${value === opt ? 'selected' : ''}`} onClick={() => onChange(opt)}>
                  <input type="radio" readOnly checked={value === opt} />
                  <label>{opt}</label>
                </div>
              ))}
            </div>
            {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
          </div>
        );
      }

      if (field.type === 'checkbox') {
        const checked = Array.isArray(value) ? value : (value ? String(value).split(',').map(v=>v.trim()).filter(Boolean) : []);
        const toggle = opt => onChange(checked.includes(opt) ? checked.filter(v => v !== opt) : [...checked, opt]);
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <div className="checkbox-group">
              {(field.options||[]).map((opt, i) => (
                <div key={i} className={`checkbox-item ${checked.includes(opt) ? 'checked' : ''}`} onClick={() => toggle(opt)}>
                  <input type="checkbox" readOnly checked={checked.includes(opt)} />
                  <label>{opt}</label>
                </div>
              ))}
            </div>
            {error && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
          </div>
        );
      }

      const maxLen = field.maxLength ? parseInt(field.maxLength, 10) : undefined;
      const isUpper = field.forceUppercase && field.forceUppercase.toLowerCase() === 'yes';
      const noMatchTypes = [...ALL_MEDIA_TYPES, 'curp', 'cp', 'gps', 'toggle', 'slider', 'range', 'multi_select'];
      const isMatchRequired = field.requireMatch && field.requireMatch.toLowerCase() === 'yes' && !noMatchTypes.includes(field.type) && !(field.options && field.options.length > 0);
      const confirmValue = formData[field.name + '_confirm'] || '';
      const confirmError = errorFields[field.name + '_confirm'];

      if (field.type === 'textarea') {
        return (
          <div className="form-group">
            <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
            <ExampleImageRender url={field.exampleImage} hidden={false} />
            <textarea className={inputCls} placeholder={field.placeholder} value={value || ''} maxLength={maxLen} rows={3} onChange={e => onChange(isUpper ? e.target.value.toUpperCase() : e.target.value)} />
            {error && !confirmError && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
            {isMatchRequired && value && (
              <div className="form-group fade-in" style={{marginTop: '12px', marginBottom: 0}}>
                <label>Confirma {field.label} *</label>
                <textarea className={confirmError ? 'input-error' : (confirmValue && value === confirmValue ? 'input-success' : '')} placeholder={`Confirma ${field.placeholder || ''}`} value={confirmValue} maxLength={maxLen} rows={3} onPaste={e => e.preventDefault()} onChange={e => updateMultipleFields({ [field.name + '_confirm']: isUpper ? e.target.value.toUpperCase() : e.target.value })} />
                {confirmError && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{confirmError}</div>}
              </div>
            )}
          </div>
        );
      }

      const handleTextChange = (e, isConfirm = false) => {
        let val = e.target.value;
        if (['tel', 'number', 'clabe'].includes(field.type)) val = val.replace(/[^0-9]/g, '');
        if (isUpper) val = val.toUpperCase();
        if (field.type === 'currency') {
          let num = val.replace(/[^0-9.]/g, '');
          if (!num) {
            isConfirm ? updateMultipleFields({ [field.name + '_confirm']: '' }) : onChange('');
            return;
          }
          const parts = num.split('.');
          if (parts.length > 2) num = parts[0] + '.' + parts.slice(1).join('');
          let res = '$ ' + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          if (parts.length > 1) res += '.' + parts[1].substring(0, 2);
          val = res;
        }
        if (isConfirm) updateMultipleFields({ [field.name + '_confirm']: val });
        else onChange(val);
      };

      let inputType = field.type;
      if (field.type === 'currency') inputType = 'text';
      if (field.type === 'clabe') inputType = 'tel';

      return (
        <div className="form-group">
          <label>{field.label}{field.required && <span style={{color:'var(--danger)',marginLeft:3}}>*</span>}<HelperTooltip text={field.helperText} /></label>
          <ExampleImageRender url={field.exampleImage} hidden={false} />
          <input type={inputType} className={inputCls} placeholder={field.placeholder} value={value || ''} maxLength={field.type === 'clabe' ? 18 : maxLen} onChange={e => handleTextChange(e, false)} />
          {error && !confirmError && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{error}</div>}
          {isMatchRequired && value && (
            <div className="form-group fade-in" style={{marginTop: '12px', marginBottom: 0}}>
              <label>Confirma {field.label} *</label>
              <input type={inputType} className={confirmError ? 'input-error' : (confirmValue && value === confirmValue ? 'input-success' : '')} placeholder={`Confirma ${field.placeholder || ''}`} value={confirmValue} maxLength={field.type === 'clabe' ? 18 : maxLen} onPaste={e => e.preventDefault()} onChange={e => handleTextChange(e, true)} />
              {confirmError && <div className="field-error"><i className="fas fa-exclamation-circle"></i>{confirmError}</div>}
            </div>
          )}
        </div>
      );
    }

    /* ==========================================================================
       PANTALLA DE ÉXITO FINAL
       ========================================================================== */
    function SuccessScreen({ id, onReset, appConfig, form }) {
      const title = appConfig?.success_title || '¡Solicitud Enviada!';
      const msg = appConfig?.success_message || 'Tu información y documentos han sido registrados exitosamente.';
      const [status, setStatus] = useState(null);
      const [loadingStatus, setLoadingStatus] = useState(false);
      const showCheck = form?.show_status_check?.toLowerCase() === 'yes';

      const handleCheckStatus = async () => {
        setLoadingStatus(true);
        try {
          const res = await serverCall('checkApplicationStatus', id);
          if (res.success) setStatus(res.status || 'En revisión');
          else Swal.fire('Error', res.message, 'error');
        } catch (e) {
          Swal.fire('Error', 'Falla al consultar.', 'error');
        }
        setLoadingStatus(false);
      };

      return (
        <div className="view-body fade-in" style={{textAlign: 'center', padding: '40px 24px'}}>
          <div style={{width: '82px', height: '82px', borderRadius: '50%', background: 'var(--verde-jara)', color: '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: '2.2rem', marginBottom: '20px', boxShadow: '0 8px 24px rgba(67,152,89,0.3)'}}>
            <i className="fas fa-check"></i>
          </div>
          <h2 style={{fontSize: '1.65rem', color: 'var(--verde-jara)', marginBottom: '10px'}}>{title}</h2>
          <p style={{color: 'var(--text-muted)', marginBottom: '22px', lineHeight: 1.5}}>{msg}</p>
          <div style={{display: 'inline-block', background: 'var(--input-bg)', padding: '12px 24px', borderRadius: '14px', fontWeight: 700, marginBottom: '26px'}}>
            Folio de referencia: #{id}
          </div>

          {showCheck && (
            <div style={{maxWidth: '380px', margin: '0 auto 26px', padding: '18px', background: '#fafafa', borderRadius: '18px', border: '1.5px solid #e5e5ea'}}>
              {!status ? (
                <button className="btn btn-secondary" style={{width: '100%'}} onClick={handleCheckStatus} disabled={loadingStatus}>
                  {loadingStatus ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-search"></i> Consultar estatus actual</>}
                </button>
              ) : (
                <div className="fade-in">
                  <p style={{fontSize: '0.86rem', color: 'var(--text-muted)', marginBottom: '6px'}}>Estatus actual:</p>
                  <strong style={{color: 'var(--verde-jara)', fontSize: '1.1rem'}}>{status.toUpperCase()}</strong>
                </div>
              )}
            </div>
          )}

          <div>
            <button className="btn btn-primary" style={{maxWidth: '260px'}} onClick={onReset}>
              <i className="fas fa-home"></i> Volver al Inicio
            </button>
          </div>
          <ContactSupport id={id} />
        </div>
      );
    }

    /* ==========================================================================
       MOTOR PRINCIPAL MULTI-STEP CON SUBIDA EN SEGUNDO PLANO Y CONTROL DE HISTORIAL
       ========================================================================== */
    function MultiStepForm({ form, appConfig, onBackToMenu, isBlocked, onHeaderChange }) {
      const steps = form.steps || [];
      const storageKey = SESSION_STORAGE_PREFIX + form.id;

      const [history, setHistory] = useState([0]);
      const [formData, setFormData] = useState({});
      const [errors, setErrors] = useState({});
      const [duplicates, setDuplicates] = useState({});
      const [dynamicOptions, setDynamicOptions] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [responseId, setResponseId] = useState(null);
      const [saving, setSaving] = useState('');
      const [scannerRequest, setScannerRequest] = useState(null);

      // Promesas de subida en segundo plano activas
      const pendingUploadsRef = useRef({});
      const ignoreNextPopRef = useRef(false);

      const total = steps.length;
      const step = history[history.length - 1] || 0;
      const isLastStep = step === total - 1;
      const currentStepObj = steps[step] || { label: '', fields: [] };
      const currentStepDisableBack = currentStepObj.fields.some(f => typeof f.disableBack === 'string' && f.disableBack.toLowerCase() === 'yes');

      const totalFields = useMemo(() => steps.reduce((sum, s) => sum + s.fields.length, 0), [steps]);
      const passedFields = useMemo(() => steps.slice(0, step).reduce((sum, s) => sum + s.fields.length, 0), [step, steps]);
      const allFields = useMemo(() => steps.flatMap(s => s.fields), [steps]);

      let progressPercentage = totalFields === 0 ? 15 : Math.max(12, (passedFields / totalFields) * 100);
      if (isLastStep) progressPercentage = 100;

      // Detectar si el paso actual tiene 2 o más tarjetas de fotos para activar Grid de 3 columnas en PC
      const mediaFieldsCountInStep = currentStepObj.fields.filter(f => CAMERA_LIVE_TYPES.includes(f.type) || FILE_UPLOAD_TYPES.includes(f.type)).length;

      // 1. Restaurar sesión desde sessionStorage al montar el formulario
      useEffect(() => {
        window.asegurarModelosFacialesGlobal();
        try {
          const raw = sessionStorage.getItem(storageKey);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.formData && Object.keys(parsed.formData).length > 0) {
              setFormData(parsed.formData);
              if (Array.isArray(parsed.history) && parsed.history.length > 0) {
                setHistory(parsed.history);
              }
            }
          }
        } catch (e) {}
      }, [form.id]);

      // 2. Guardar en sessionStorage cada vez que cambie formData o history
      useEffect(() => {
        if (submitted) return;
        try {
          // Guardamos copia ligera sin saturar quota si ya tiene URL de Drive
          const lightData = { ...formData };
          Object.keys(lightData).forEach(k => {
            const v = lightData[k];
            if (v && typeof v === 'object' && v.url) {
              lightData[k] = { ...v, base64: null };
            }
          });
          sessionStorage.setItem(storageKey, JSON.stringify({ formData: lightData, history }));
        } catch (e) {}
      }, [formData, history, submitted]);

      // 3. Candado onbeforeunload para evitar que cierre pestaña dejando archivos huérfanos sin enviar
      const hasAnyProgress = useMemo(() => Object.keys(formData).length > 0 && !submitted, [formData, submitted]);
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (hasAnyProgress) {
            e.preventDefault();
            e.returnValue = 'Aún no has enviado tu solicitud. ¿Seguro que deseas salir?';
            return e.returnValue;
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [hasAnyProgress]);

      // 4. Sincronizar Banner Azul Hielo y Barra Superior con el paso actual
      useEffect(() => {
        if (submitted) {
          onHeaderChange({ pct: 100, title: 'Solicitud completada', sub: 'Tu expediente ha sido registrado correctamente.', wide: false });
        } else {
          onHeaderChange({
            pct: progressPercentage,
            title: currentStepObj.label || form.title,
            sub: form.subtitle || 'Completa la información solicitada para continuar.',
            wide: mediaFieldsCountInStep >= 2
          });
        }
      }, [step, submitted, progressPercentage, mediaFieldsCountInStep]);

      // 5. Control del botón "Atrás" físico en Android/iOS (popstate)
      useEffect(() => {
        try {
          window.history.pushState({ stepIndex: step }, '', `#paso-${step + 1}`);
        } catch (e) {}

        const onPopState = () => {
          if (ignoreNextPopRef.current) {
            ignoreNextPopRef.current = false;
            return;
          }
          // Si el modal de cámara está abierto, el botón "Atrás" solo cierra la cámara
          if (scannerRequest) {
            setScannerRequest(null);
            return;
          }
          if (Swal.isVisible()) {
            Swal.close();
            return;
          }
          if (history.length > 1 && !currentStepDisableBack) {
            setHistory(prev => prev.slice(0, -1));
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (hasAnyProgress) {
            try { window.history.pushState({ stepIndex: step }, '', `#paso-${step + 1}`); } catch (e) {}
            Swal.fire({
              icon: 'question',
              title: '¿Salir de la solicitud?',
              text: 'Tu avance sigue guardado temporalmente en esta sesión.',
              showCancelButton: true,
              confirmButtonText: 'Permanecer aquí',
              cancelButtonText: 'Salir al inicio',
              confirmButtonColor: '#439859'
            }).then(res => {
              if (!res.isConfirmed && onBackToMenu) onBackToMenu();
            });
          } else if (onBackToMenu) {
            onBackToMenu();
          }
        };

        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, [step, history, scannerRequest, hasAnyProgress, currentStepDisableBack]);

      const updateField = (name, val) => {
        setFormData(prev => ({ ...prev, [name]: val }));
        setErrors(prev => { const e = { ...prev }; delete e[name]; return e; });
      };

      const updateMultipleFields = (updates) => {
        setFormData(prev => ({ ...prev, ...updates }));
        setErrors(prev => {
          const nextE = { ...prev };
          Object.keys(updates).forEach(k => delete nextE[k]);
          return nextE;
        });
      };

      /* --- MOTOR DE SUBIDA EN SEGUNDO PLANO INSTANTÁNEA --- */
      const dispararUploadIndividual = (field, base64Data, customSuffix = '', mime = 'image/jpeg') => {
        const cleanB64 = String(base64Data).includes(',') ? String(base64Data).split(',')[1] : String(base64Data);
        const isRestricted = field.restrictedFile && field.restrictedFile.toLowerCase() === 'yes';
        const safeClient = (formData.nombre_completo || formData.nombres || 'Solicitante').replace(/[^a-zA-Z0-9]/g, '_');
        const ext = mime.includes('pdf') ? 'pdf' : (mime.includes('png') ? 'png' : 'jpg');
        const fileName = `${safeClient}_${field.name}${customSuffix ? '_' + customSuffix : ''}_${Date.now()}.${ext}`;

        return serverCall('uploadFile', cleanB64, fileName, mime, isRestricted).then(res => {
          if (res && res.success && res.data?.url) {
            return res.data.url;
          }
          throw new Error(res?.message || 'Error al subir archivo');
        });
      };

      const handleOpenScanner = (field) => {
        let mode = 'horizontal';
        if (field.type === 'foto_vertical') mode = 'vertical';
        else if (field.type === 'selfie_caracompleta') mode = 'bio5';
        else if (field.type === 'selfie_caranormal') mode = 'selfie1';

        try { window.history.pushState({ cameraModal: true }, '', '#camara'); } catch (e) {}
        setScannerRequest({ field, mode, label: field.label });
      };

      const handleScannerComplete = (result) => {
        const field = scannerRequest.field;
        setScannerRequest(null);

        if (result.type === 'single') {
          const dataUrl = result.dataUrl;
          const b64 = dataUrl.split(',')[1];
          updateField(field.name, {
            preview: dataUrl,
            base64: b64,
            mime: 'image/jpeg',
            name: `${field.name}.jpg`,
            url: null,
            status: 'uploading'
          });

          const upPromise = dispararUploadIndividual(field, b64, '', 'image/jpeg')
            .then(url => {
              setFormData(prev => ({
                ...prev,
                [field.name]: { ...(prev[field.name] || {}), url, status: 'uploaded' }
              }));
            })
            .catch(() => {
              setFormData(prev => ({
                ...prev,
                [field.name]: { ...(prev[field.name] || {}), status: 'error' }
              }));
            })
            .finally(() => {
              delete pendingUploadsRef.current[field.name];
            });

          pendingUploadsRef.current[field.name] = upPromise;
        } else if (result.type === 'bio5') {
          // selfie_caracompleta: Sube las 5 fotos en paralelo, guarda Frente en field.name y las 5 URLs separadas por coma en field.name + '_angulos'
          const anglesObj = result.anglesDataUrls; // { frente, abajo, arriba, izquierda, derecha }
          const frenteDataUrl = anglesObj.frente;
          updateField(field.name, {
            preview: frenteDataUrl,
            base64: frenteDataUrl.split(',')[1],
            anglesBase64: anglesObj,
            mime: 'image/jpeg',
            name: `${field.name}_frente.jpg`,
            url: null,
            anglesUrls: null,
            status: 'uploading'
          });

          const orden = ['frente', 'abajo', 'arriba', 'izquierda', 'derecha'];
          const multiPromise = Promise.all(
            orden.map(k => dispararUploadIndividual(field, anglesObj[k], k.toUpperCase(), 'image/jpeg'))
          ).then(urls => {
            const frenteUrl = urls[0];
            const cincoUrlsComa = urls.join(', ');
            setFormData(prev => ({
              ...prev,
              [field.name]: {
                ...(prev[field.name] || {}),
                url: frenteUrl,
                anglesUrls: cincoUrlsComa,
                status: 'uploaded'
              },
              [field.name + '_angulos']: cincoUrlsComa
            }));
          }).catch(() => {
            setFormData(prev => ({
              ...prev,
              [field.name]: { ...(prev[field.name] || {}), status: 'error' }
            }));
          }).finally(() => {
            delete pendingUploadsRef.current[field.name];
          });

          pendingUploadsRef.current[field.name] = multiPromise;
        }
      };

      const handleDeviceFileSelected = (field, fileObj) => {
        updateField(field.name, { ...fileObj, url: null, status: 'uploading' });
        const upPromise = dispararUploadIndividual(field, fileObj.base64, '', fileObj.mime)
          .then(url => {
            setFormData(prev => ({
              ...prev,
              [field.name]: { ...(prev[field.name] || {}), url, status: 'uploaded' }
            }));
          })
          .catch(() => {
            setFormData(prev => ({
              ...prev,
              [field.name]: { ...(prev[field.name] || {}), status: 'error' }
            }));
          })
          .finally(() => {
            delete pendingUploadsRef.current[field.name];
          });

        pendingUploadsRef.current[field.name] = upPromise;
      };

      const handleSignatureSaved = (field, dataUrl) => {
        const b64 = dataUrl.split(',')[1];
        updateField(field.name, {
          preview: dataUrl,
          base64: b64,
          mime: 'image/jpeg',
          name: `${field.name}_firma.jpg`,
          url: null,
          status: 'uploading'
        });
        const upPromise = dispararUploadIndividual(field, b64, 'FIRMA', 'image/jpeg')
          .then(url => {
            setFormData(prev => ({
              ...prev,
              [field.name]: { ...(prev[field.name] || {}), url, status: 'uploaded' }
            }));
          })
          .catch(() => {})
          .finally(() => {
            delete pendingUploadsRef.current[field.name];
          });
        pendingUploadsRef.current[field.name] = upPromise;
      };

      /* --- VALIDACIÓN DE PASO --- */
      const validate = (idx) => {
        const errs = {};
        (steps[idx]?.fields || []).forEach(f => {
          if (f.type === 'curp') {
            if (f.required) {
              if (!formData.nombres) errs.nombres = "Obligatorio";
              if (!formData.apellido_paterno) errs.apellido_paterno = "Obligatorio";
              if (!formData.apellido_materno) errs.apellido_materno = "Obligatorio";
              if (!formData.curp || formData.curp.length !== 18 || !formData.rfc) errs.curp = "Presiona Validar en tu CURP";
            }
            return;
          }
          if (f.type === 'cp') {
            if (f.required) {
              if (!formData.cp || formData.cp.length !== 5 || !formData.estado) errs.cp = "Valida tu Código Postal";
              if (!formData.colonia) errs.colonia = "Selecciona una colonia";
              if (!formData.calle) errs.calle = "Obligatorio";
              if (!formData.num_ext) errs.num_ext = "Obligatorio";
              if (!formData.entre_calles) errs.entre_calles = "Obligatorio";
              if (!formData.referencia) errs.referencia = "Obligatorio";
            }
            return;
          }

          const v = formData[f.name];
          const empty = v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);

          if (!empty && !ALL_MEDIA_TYPES.includes(f.type)) {
            if (f.type === 'clabe' && (String(v).length !== 18 || !window.validarClabeOficial(String(v)))) {
              errs[f.name] = 'CLABE inválida (verifica los 18 dígitos)';
            }
            if (f.requireAlphanumeric && f.requireAlphanumeric.toLowerCase() === 'yes' && !(f.options && f.options.length > 0)) {
              if (!/[a-zA-Z]/.test(v) || !/[0-9]/.test(v)) {
                errs[f.name] = 'Debe contener letras y números';
              }
            }
            const noMatchTypes = [...ALL_MEDIA_TYPES, 'curp', 'cp', 'gps', 'toggle', 'slider', 'range', 'multi_select'];
            if (f.requireMatch && f.requireMatch.toLowerCase() === 'yes' && !noMatchTypes.includes(f.type) && !(f.options && f.options.length > 0)) {
              const confirmVal = formData[f.name + '_confirm'];
              if (!confirmVal) errs[f.name + '_confirm'] = 'Confirma la información';
              else if (v !== confirmVal) errs[f.name + '_confirm'] = 'Los datos no coinciden';
            }
          }

          if (f.copyFrom) {
            const src = allFields.find(x => String(x.id) === String(f.copyFrom));
            if (src) {
              const valTarget = formData[f.name];
              const valSource = src.type === 'curp' ? formData['nombre_completo'] : formData[src.name];
              const strT = Array.isArray(valTarget) ? valTarget.join(',').toLowerCase() : String(valTarget || '').trim().toLowerCase();
              const strS = Array.isArray(valSource) ? valSource.join(',').toLowerCase() : String(valSource || '').trim().toLowerCase();
              if (strT !== strS) errs[f.name] = 'No coincide con el registro original';
            }
          }

          if (!f.required) return;
          if (ALL_MEDIA_TYPES.includes(f.type)) {
            if (!v || (!v.base64 && !v.url && !v.preview)) errs[f.name] = 'Captura o archivo obligatorio';
            return;
          }
          if (empty) {
            errs[f.name] = f.type === 'email' ? 'Debes verificar tu correo' : 'Obligatorio';
          }
        });

        (steps[idx]?.fields || []).forEach(f => {
          if (f.type === 'email' && duplicates[f.name]) errs[f.name] = 'Correo ya registrado';
        });

        return errs;
      };

      const next = () => {
        const errs = validate(step);
        if (Object.keys(errs).length) {
          setErrors(errs);
          Swal.fire({ title: 'Atención', text: 'Verifica los campos marcados en rojo para continuar.', icon: 'warning', confirmButtonColor: '#439859' });
          return;
        }
        setErrors({});

        let nextStep = step + 1;
        for (const f of currentStepObj.fields) {
          if (f.skipLogic && formData[f.name]) {
            const rules = f.skipLogic.split('|');
            for (const rule of rules) {
              const parts = rule.split(':');
              if (parts.length === 2) {
                const val = parts[0].trim();
                const targetIdx = parseInt(parts[1].trim(), 10) - 1;
                const ans = formData[f.name];
                const isMatch = Array.isArray(ans) ? ans.some(a => String(a).trim() === val) : String(ans).trim() === val;
                if (isMatch && targetIdx > step && targetIdx < total) {
                  nextStep = targetIdx;
                  break;
                }
              }
            }
          }
          if (nextStep !== step + 1) break;
        }

        setHistory(prev => [...prev, nextStep]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const prev = () => {
        setErrors({});
        setHistory(prev => prev.slice(0, -1));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      /* --- ENVÍO FINAL ULTRA-RÁPIDO --- */
      const submit = async () => {
        const errs = validate(step);
        if (Object.keys(errs).length) {
          setErrors(errs);
          Swal.fire({ title: 'Faltan datos', text: 'Completa todos los campos obligatorios antes de enviar.', icon: 'warning', confirmButtonColor: '#439859' });
          return;
        }

        setSaving('Sincronizando documentos...');
        try {
          // Esperar cualquier subida en segundo plano que siga en curso
          const activePromises = Object.values(pendingUploadsRef.current);
          if (activePromises.length > 0) {
            await Promise.allSettled(activePromises);
          }

          const payload = { ...formData, _form_id_: form.id };
          const mediaFields = steps.flatMap(s => s.fields).filter(f => ALL_MEDIA_TYPES.includes(f.type));

          // Verificar que todas las fotos/archivos tengan su URL de Drive; si alguna falló en background, la subimos aquí
          for (const f of mediaFields) {
            const item = payload[f.name];
            if (!item) continue;

            if (f.type === 'selfie_caracompleta') {
              if (item.url && item.anglesUrls) {
                payload[f.name] = item.url;
                payload[f.name + '_angulos'] = item.anglesUrls;
              } else if (item.anglesBase64) {
                const orden = ['frente', 'abajo', 'arriba', 'izquierda', 'derecha'];
                const urls = await Promise.all(orden.map(k => dispararUploadIndividual(f, item.anglesBase64[k], k.toUpperCase(), 'image/jpeg')));
                payload[f.name] = urls[0];
                payload[f.name + '_angulos'] = urls.join(', ');
              }
            } else {
              if (item.url) {
                payload[f.name] = item.url;
              } else if (item.base64) {
                const url = await dispararUploadIndividual(f, item.base64, '', item.mime || 'image/jpeg');
                payload[f.name] = url;
              }
            }
          }

          setSaving('Guardando solicitud...');
          const res = await serverCall('submitForm', payload);
          setSaving('');

          if (res.success) {
            sessionStorage.removeItem(storageKey);
            setResponseId(res.data.id);
            setSubmitted(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            Swal.fire({ icon: 'error', title: 'Error al guardar', text: res.message, confirmButtonColor: '#439859' });
          }
        } catch (e) {
          setSaving('');
          Swal.fire({ icon: 'error', title: 'Problema de conexión', text: e.message || 'Intenta enviar nuevamente.', confirmButtonColor: '#439859' });
        }
      };

      if (submitted) {
        return (
          <SuccessScreen
            id={responseId}
            appConfig={appConfig}
            form={form}
            onReset={() => {
              sessionStorage.removeItem(storageKey);
              if (onBackToMenu) onBackToMenu();
              else {
                setSubmitted(false);
                setHistory([0]);
                setFormData({});
                setErrors({});
              }
            }}
          />
        );
      }

      return (
        <div className="view-body fade-in">
          <fieldset disabled={isBlocked} style={{border: 'none', padding: 0, margin: 0, minWidth: 0, opacity: isBlocked ? 0.6 : 1}}>
            <div className={`step-fields-layout ${mediaFieldsCountInStep >= 2 ? 'multi-photos-grid' : ''}`}>
              {currentStepObj.fields.map(f => (
                <FieldRenderer
                  key={f.id}
                  field={f}
                  value={formData[f.name] !== undefined ? formData[f.name] : (['checkbox', 'multi_select'].includes(f.type) ? [] : (ALL_MEDIA_TYPES.includes(f.type) ? null : (f.type === 'toggle' ? 'No' : '')))}
                  onChange={val => updateField(f.name, val)}
                  formData={formData}
                  updateMultipleFields={updateMultipleFields}
                  dynamicOptions={dynamicOptions}
                  setDynamicOptions={setDynamicOptions}
                  errorFields={errors}
                  onDuplicateResult={(name, isDup) => setDuplicates(prev => ({ ...prev, [name]: isDup }))}
                  onOpenScanner={handleOpenScanner}
                  onDeviceFileSelected={handleDeviceFileSelected}
                  onSignatureSaved={handleSignatureSaved}
                  onClearMedia={(fieldName) => updateField(fieldName, null)}
                />
              ))}
            </div>
          </fieldset>

          <div className="privacy-text">
            La carga y uso de información y datos personales es responsabilidad del usuario.<br/>
            <span className="privacy-link" onClick={() => { if (!isBlocked) window.mostrarAvisoPrivacidad(); }}>Consultar Aviso de Privacidad</span>
          </div>

          <div className="form-nav">
            {history.length > 1 && !currentStepDisableBack ? (
              <button type="button" className="btn btn-secondary" onClick={prev} disabled={isBlocked} style={{maxWidth: '150px'}}>
                <i className="fas fa-chevron-left"></i> Atrás
              </button>
            ) : (
              (step === 0 && onBackToMenu) ? (
                <button type="button" className="btn btn-ghost" onClick={onBackToMenu}>
                  <i className="fas fa-chevron-left"></i> Inicio
                </button>
              ) : <span></span>
            )}

            {!isLastStep ? (
              <button type="button" className="btn btn-primary" onClick={next} disabled={isBlocked} style={{maxWidth: '220px', marginLeft: 'auto'}}>
                Siguiente <i className="fas fa-arrow-right"></i>
              </button>
            ) : (
              <button type="button" className="btn btn-success" onClick={submit} disabled={!!saving || isBlocked} style={{maxWidth: '280px', marginLeft: 'auto'}}>
                {saving ? <><i className="fas fa-spinner fa-spin"></i> {saving}</> : <><i className="fas fa-paper-plane"></i> Enviar Solicitud</>}
              </button>
            )}
          </div>

          {scannerRequest && (
            <SmartCameraModal
              request={scannerRequest}
              onClose={() => setScannerRequest(null)}
              onComplete={handleScannerComplete}
            />
          )}
        </div>
      );
    }

    /* ==========================================================================
       APP SHELL PRINCIPAL
       ========================================================================== */
    function App() {
      const [config, setConfig] = useState(null);
      const [selectedFormId, setSelectedFormId] = useState(null);
      const [loading, setLoading] = useState(true);
      const [initError, setInitError] = useState('');
      const [headerState, setHeaderState] = useState({
        pct: 12,
        title: 'Portal PrestaJara',
        sub: 'Selecciona una opción para iniciar tu solicitud digital.',
        wide: false
      });

      const handleSelectForm = (id) => {
        const f = config?.forms.find(x => x.id === id);
        const needsCheck = f && f.require_browser_check && f.require_browser_check.toLowerCase() === 'yes';
        if (needsCheck && !window.esNavegadorCompatible()) {
          window.mostrarAlertaBloqueo();
        } else {
          setSelectedFormId(id);
        }
      };

      useEffect(() => {
        serverCall('getFormConfig').then(res => {
          setLoading(false);
          if (res && res.success) {
            setConfig(res.data);
            if (res.data.forms && res.data.forms.length === 1) {
              const f = res.data.forms[0];
              const needsCheck = f.require_browser_check && f.require_browser_check.toLowerCase() === 'yes';
              const showStatus = f.show_status_check && f.show_status_check.toLowerCase() === 'yes';
              if (needsCheck && !window.esNavegadorCompatible()) {
                window.mostrarAlertaBloqueo();
              }
              if (!showStatus) {
                setSelectedFormId(f.id);
              }
            }
          } else {
            setInitError(res?.message || 'Error al cargar la configuración.');
          }
        }).catch(() => {
          setLoading(false);
          setInitError('No se pudo conectar con el servidor. Verifica la URL de implementación de Google Apps Script.');
        });
      }, []);

      const forms = config?.forms || [];
      const showWelcome = !selectedFormId && (forms.length > 1 || forms.some(f => f.show_status_check?.toLowerCase() === 'yes'));
      const currentForm = forms.find(f => f.id === selectedFormId) || forms[0];
      const isBlocked = currentForm?.require_browser_check?.toLowerCase() === 'yes' && !window.esNavegadorCompatible();

      return (
        <div className="app-shell">
          <header className="top-brand-bar">
            <div className="top-brand-inner">
              <img src={LOGO} alt="PrestaJara" />
              <div className="top-brand-title">PrestaJara</div>
            </div>
            <div className="step-progress-track">
              <div className="step-progress-fill" style={{ width: `${showWelcome ? 12 : headerState.pct}%` }}></div>
            </div>
          </header>

          <section className="instruction-banner">
            <h2>{showWelcome ? 'Bienvenido(a) al Portal' : headerState.title}</h2>
            <p>{showWelcome ? 'Selecciona el trámite que deseas realizar o consulta tu estatus.' : headerState.sub}</p>
          </section>

          <main className={`app-container ${!showWelcome && headerState.wide ? 'wide-desktop-card' : ''}`}>
            {loading ? (
              <div className="view-body">
                <div className="skeleton" style={{height: 28, width: '55%', marginBottom: 24}}></div>
                <div className="skeleton" style={{height: 54, width: '100%', marginBottom: 18}}></div>
                <div className="skeleton" style={{height: 54, width: '100%', marginBottom: 18}}></div>
                <div className="skeleton" style={{height: 54, width: '100%', marginBottom: 18}}></div>
              </div>
            ) : initError ? (
              <div className="view-body" style={{textAlign: 'center', padding: '50px 20px'}}>
                <i className="fas fa-triangle-exclamation" style={{fontSize: '3rem', color: 'var(--danger)', marginBottom: '14px'}}></i>
                <p style={{fontWeight: 600, color: 'var(--text-muted)'}}>{initError}</p>
              </div>
            ) : showWelcome ? (
              <WelcomeScreen forms={forms} onSelect={handleSelectForm} />
            ) : (!currentForm || !currentForm.steps || currentForm.steps.length === 0) ? (
              <div className="view-body" style={{textAlign: 'center', padding: '45px 20px'}}>
                <i className="fas fa-tools" style={{fontSize: '3rem', color: '#c7c7cc', marginBottom: '14px'}}></i>
                <h3>Formulario sin preguntas activas</h3>
                <p style={{color: 'var(--text-muted)', marginTop: '8px'}}>Configura los campos en la hoja Settings.</p>
                {forms.length > 1 && (
                  <button className="btn btn-secondary" style={{marginTop: '20px'}} onClick={() => setSelectedFormId(null)}>Volver al inicio</button>
                )}
              </div>
            ) : (
              <MultiStepForm
                form={currentForm}
                appConfig={config.appConfig}
                onBackToMenu={(forms.length > 1 || forms.some(f => f.show_status_check?.toLowerCase() === 'yes')) ? () => setSelectedFormId(null) : null}
                isBlocked={isBlocked}
                onHeaderChange={setHeaderState}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
